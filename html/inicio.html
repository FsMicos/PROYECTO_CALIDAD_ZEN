<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/inicio.css">
</head>
<body>
    <div class="container">
        <div id="difficulty-modal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span> <!-- Botón de cierre -->
                <h2>Selecciona la dificultad</h2>
                <button class="difficulty-button" data-difficulty="10">Fácil (10 palabras)</button>
                <button class="difficulty-button" data-difficulty="16">Medio (16 palabras)</button>
                <button class="difficulty-button" data-difficulty="20">Difícil (20 palabras)</button>
            </div>
        </div>        
        <h1>Lista de Pacientes</h1>
        
        <!-- Botón para registrar pacientes -->
        <button id="registrarPacienteButton" class="button register-button">Registrar Paciente</button>
        <!-- Contenedor para la lista de pacientes   -->
        <div id="patient-list" class="board">
            <!-- Aquí se cargarán los pacientes dinámicamente -->
        </div>
    </div>
    <script src="../assets/js/inicio.js"></script>
</body>
</html>
